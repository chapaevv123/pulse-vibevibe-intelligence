name: Pulse x vibe/vibe incremental sync

# Free-tier redesign: this replaces the Cloudflare Worker's Cron Trigger,
# which cannot fit our sync's real CPU cost inside Workers Free's 10ms
# per-invocation budget. GitHub-hosted runners have no comparable ceiling,
# and public repos get unlimited free Actions minutes. The Worker keeps
# serving the dashboard/read-only API (unchanged); this workflow is the
# ONLY thing that writes to D1 now. See docs/DEPLOYMENT.md.
on:
  # GitHub's native `schedule:` trigger is intentionally NOT used here.
  # PULSE × VIBE/VIBE GITHUB SCHEDULER CANARY V1 (2026-09-14) confirmed
  # GITHUB_SCHEDULE_DELIVERY_FAILED for this repository: three different
  # cron patterns (this workflow's `*/15` and shifted `7,22,37,52`, plus
  # an isolated scheduler-canary.yml with the same shifted cadence) each
  # missed every expected boundary — zero scheduled runs ever appeared,
  # despite workflow config independently verified correct every time
  # (state active, Actions enabled, correct file on main) and a clean D1
  # lock/sync_runs throughout. See PULSE × VIBE/VIBE CLOUDFLARE DISPATCH
  # SCHEDULER V1: cadence is now driven externally by a separate,
  # ultra-light Cloudflare Worker (../dispatch_scheduler) whose only job
  # is POSTing to this workflow's workflow_dispatch REST endpoint every
  # ~15 minutes — see docs/DEPLOYMENT.md. Do not re-add a `schedule:`
  # trigger here without first re-diagnosing GitHub's schedule delivery;
  # running two schedulers at once is never correct.
  workflow_dispatch: {} # owner-controlled manual run AND the dispatch scheduler's target

# GitHub-side overlap guard. NOT the authoritative protection — the D1
# lease in src/lock.js is (it works regardless of which scheduler or how
# many different callers exist). This just avoids wasting a runner on a
# run that would immediately SKIPPED_LOCKED anyway.
concurrency:
  group: pulse-vibevibe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # safety ceiling above the ~15-min in-process TIME_BUDGET_MS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run incremental sync
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/sync-cron.mjs
