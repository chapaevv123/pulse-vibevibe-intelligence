name: Scheduler canary

# PULSE × VIBE/VIBE GITHUB SCHEDULER CANARY V1 (2026-09-14).
#
# Completely isolated from the Pulse sync workflow (sync.yml) — no
# Cloudflare token, no D1, no vibe/vibe API, no repository secrets, no
# repository variables, no Node/npm, no database writes, no external
# APIs. Its only purpose is to answer one question: does GitHub Actions'
# `schedule` event fire at all for this repository? sync.yml's own
# schedule (tried at both `*/15 * * * *` and a shifted `7,22,37,52 * * *
# *`) missed every expected boundary with zero runs ever created, despite
# verified-correct config — this canary isolates whether that's a
# repo-wide GitHub Actions scheduling problem or something specific to
# sync.yml.
#
# sync.yml's own schedule trigger is commented out while this canary is
# active, so only one scheduler runs at a time.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "11,26,41,56 * * * *"

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Print event name
        run: echo "event_name=${{ github.event_name }}"

      - name: Print current UTC time
        run: date -u

      - name: Print commit SHA
        run: echo "sha=${{ github.sha }}"

      - name: Print pass marker
        run: echo "scheduler canary PASS"
